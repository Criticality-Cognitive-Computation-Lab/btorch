package:
  name: btorch
  version: "0.1.0"

source:
  path: ../..

build:
  number: 0
  script: python -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.10
    - pip
  run:
    - python >=3.10
    - pytorch
    - numpy >=1.24
    - pandas >=2
    - scipy >=1.10
    - jaxtyping >=0.2.20
    - h5py
    - hdf5plugin
    - pyyaml
    - omegaconf
    - matplotlib-base >=3.7
  # Optional extras (pip: btorch[io], btorch[analysis], btorch[viz]); not
  # installed by default, constrained here so conda keeps compatible versions.
  run_constrained:
    - xarray
    - zarr
    - numcodecs
    - powerlaw
    - nolds !=0.6.3
    - fastdtw
    - plotly
    - networkx

test:
  requires:
    - pytest
  commands:
    - python -c "import btorch; print(btorch.__version__)"
    - pytest -q tests/models --disable-warnings --maxfail=1

about:
  license: see LICENSE
  summary: Brain-inspired torch utilities and models for neuromorphic research.

extra:
  recipe-maintainers:
    - neuromorphic-research
