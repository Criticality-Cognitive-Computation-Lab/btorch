name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Set to true to run CI"
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    permissions:
      contents: read
      pull-requests: write
    # Push: always run.
    # PR: auto-run unless the author is new (first-timer/none); new authors require the `run-ci` label.
    # Manual dispatch: requires confirm=true.
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          (
            !contains(fromJson('["FIRST_TIMER","FIRST_TIME_CONTRIBUTOR","NONE"]'), github.event.pull_request.author_association)
            || contains(github.event.pull_request.labels.*.name, 'run-ci')
          )
        ) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'true')
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          # torch-sparse/torch-scatter are optional and have wheels tied to
          # specific Torch builds. The default matrix exercises the native
          # sparse runtime; the opt-in job below covers the PyG backend.
          uv sync --group dev --extra all --frozen

      - name: Lint
        run: uv run ruff check .
        continue-on-error: true

      - name: Tests (CPU)
        run: uv run pytest tests --cov=btorch --cov-report=xml

      # - name: Setup tmate session
      #   if: failure()
      #   uses: mxschmitt/action-tmate@v3

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build docs
        run: uv run python scripts/docs.py command=build-all

  build-test-windows:
    permissions:
      contents: read
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          (
            !contains(fromJson('["FIRST_TIMER","FIRST_TIME_CONTRIBUTOR","NONE"]'), github.event.pull_request.author_association)
            || contains(github.event.pull_request.labels.*.name, 'run-ci')
          )
        ) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'true')
      }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        shell: bash
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv sync --group test --extra all --frozen

      - name: Tests (CPU)
        run: uv run pytest tests --cov=btorch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests-windows
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-torch-sparse:
    permissions:
      contents: read
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'test-torch-sparse')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install optional torch-sparse backend
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv sync --group test --extra all --frozen
          uv pip install --reinstall torch==2.8.0+cpu torchvision==0.23.0+cpu --index-url https://download.pytorch.org/whl/cpu
          uv pip install torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.8.0+cpu.html

      - name: Tests (torch-sparse backend)
        run: |
          uv run pytest -q \
            tests/sparse/test_runtime_ops.py \
            tests/models/connection/test_sparse_connection_legacy_cases.py
